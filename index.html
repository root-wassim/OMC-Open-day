function caesar(text, shift) {
  const k = ((shift % 26) + 26) % 26;
  return text.replace(/[a-z]/gi, c => {
    const base = c <= "Z" ? 65 : 97;
    return String.fromCharCode((c.charCodeAt(0) - base + k) % 26 + base);
  });
}
// Base64 with correct UTF-8 handling and validation.
function b64enc(text) {
  let bin = "";
  new TextEncoder().encode(text).forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64dec(text) {
  const clean = text.replace(/\s+/g, "");
  if (!clean) throw new Error("Enter some Base64 text first.");
  if (!/^[A-Za-z0-9+/]*={0,2}$/.test(clean) || clean.length % 4 === 1) {
    throw new Error("This is not valid Base64. Allowed: letters, digits, + / and = padding.");
  }
  const bytes = Uint8Array.from(atob(clean), c => c.charCodeAt(0));
  try { return new TextDecoder("utf-8", { fatal: true }).decode(bytes); }
  catch (e) { throw new Error("The decoded bytes are not valid UTF-8 text."); }
}
function hexToText(text) {
  const clean = text.replace(/0x/gi, "").replace(/[\s,:-]+/g, "");
  if (!clean || clean.length % 2 || !/^[0-9a-f]+$/i.test(clean)) {
    throw new Error("Enter an even number of hex digits (0-9, A-F), e.g. 48 69.");
  }
  const bytes = new Uint8Array(clean.match(/../g).map(x => parseInt(x, 16)));
  try { return new TextDecoder("utf-8", { fatal: true }).decode(bytes); }
  catch (e) { throw new Error("These bytes are not valid UTF-8 text."); }
}
function textToHex(text) {
  return Array.from(new TextEncoder().encode(text)).map(b => b.toString(16).padStart(2, "0")).join(" ");
